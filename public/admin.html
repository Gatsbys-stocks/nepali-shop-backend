<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pedidos — Buddhabhumi Admin</title>
<style>
  body{font-family:sans-serif;max-width:900px;margin:30px auto;padding:0 16px;background:#171b34;color:#f4efe1;}
  h1{font-size:22px;}
  input{padding:8px;border-radius:6px;border:1px solid #444;background:#1e2444;color:#fff;width:280px;}
  button{padding:8px 14px;border-radius:6px;border:none;background:#e0a63d;color:#241a06;font-weight:600;cursor:pointer;margin-left:8px;}
  table{width:100%;border-collapse:collapse;margin-top:20px;}
  th,td{text-align:left;padding:8px;border-bottom:1px solid #333;font-size:13px;vertical-align:top;}
  .label-btn{background:#5c8a6a;color:#0f1b13;}
  pre{white-space:pre-wrap;font-size:12px;color:#c9c3ae;}
</style>
</head>
<body>
  <h1>Pedidos — Buddhabhumi</h1>
  <div>
    <input id="adminKey" type="password" placeholder="Clave de administrador (ADMIN_KEY)">
    <input id="apiBase" type="text" placeholder="URL del backend, ej: https://tu-backend.onrender.com" style="width:340px">
    <button onclick="load()">Cargar pedidos</button>
  </div>
  <table id="tbl"><thead>
    <tr><th>Pedido</th><th>Cliente</th><th>Dirección</th><th>Productos</th><th>Envío</th><th>Total</th><th>Etiqueta</th></tr>
  </thead><tbody></tbody></table>

<script>
function money(n){ return n.toFixed(2) + " €"; }

async function load(){
  const key = document.getElementById('adminKey').value;
  const base = document.getElementById('apiBase').value.replace(/\/$/,'');
  localStorage.setItem('adminKey', key);
  localStorage.setItem('apiBase', base);
  const res = await fetch(base + '/api/orders', { headers: { 'x-admin-key': key } });
  if(!res.ok){ alert('No se pudo cargar (revisa la clave y la URL).'); return; }
  const orders = await res.json();
  const tbody = document.querySelector('#tbl tbody');
  tbody.innerHTML = orders.map(o => `
    <tr>
      <td><b>${o.id}</b><br><small>${new Date(o.created_at).toLocaleString()}</small><br>${o.status}</td>
      <td>${o.customer.name}<br>${o.customer.phone}<br>${o.customer.email||''}</td>
      <td>${o.address.street1}${o.address.street2 ? '<br>'+o.address.street2 : ''}<br>${o.address.city}, ${o.address.zip}<br>${o.address.country}</td>
      <td><pre>${o.items.map(i=>`${i.name} (${i.size}) x${i.qty}`).join('\n')}</pre>
      Subtotal: ${money(o.items_total)}</td>
      <td>${o.shipping.carrier} ${o.shipping.service}<br>${money(o.shipping.amount)}</td>
      <td><b>${money(o.items_total + o.shipping.amount)}</b></td>
      <td>${o.label
        ? `<a href="${o.label.label_url}" target="_blank">Ver PDF</a><br>${o.label.tracking_number}`
        : `<button class="label-btn" onclick="buyLabel('${o.id}')">Comprar etiqueta</button>`}
      </td>
    </tr>
  `).join('');
}

async function buyLabel(id){
  const key = document.getElementById('adminKey').value;
  const base = document.getElementById('apiBase').value.replace(/\/$/,'');
  const res = await fetch(base + '/api/orders/' + id + '/label', { method:'POST', headers: { 'x-admin-key': key } });
  const data = await res.json();
  if(!res.ok){ alert(data.error || 'Error al comprar la etiqueta'); return; }
  load();
}

window.onload = () => {
  document.getElementById('adminKey').value = localStorage.getItem('adminKey') || '';
  document.getElementById('apiBase').value = localStorage.getItem('apiBase') || '';
};
</script>
</body>
</html>

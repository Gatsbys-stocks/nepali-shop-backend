<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos — Buddhabhumi Admin</title>
<link rel="stylesheet" href="css/products-admin.css">
</head>
<body>
  <h1>Productos — Buddhabhumi</h1>
  <div class="top">
    <input id="adminKey" type="password" placeholder="Clave de administrador (ADMIN_KEY)">
    <input id="apiBase" type="text" placeholder="URL del backend, ej: https://tu-backend.onrender.com">
    <button id="loadBtn" type="button">Cargar productos</button>
  </div>
  <div id="msg"></div>

  <h2 id="formTitle">Añadir producto</h2>
  <form id="productForm">
    <input type="hidden" id="editId">
    <div class="row">
      <input id="fName" placeholder="Nombre (nepalí)" required>
      <input id="fEn" placeholder="Traducción (inglés)" required>
    </div>
    <div class="row">
      <select id="fCat" required></select>
      <input id="fSize" placeholder="Tamaño, ej: 500 gm / 1 kg / 1 ud" required>
      <input id="fPrice" type="number" step="0.01" min="0" placeholder="Precio (€)" required>
      <input id="fPack" placeholder="Pack (opcional), ej: 16€ / 30 pkt">
    </div>
    <div class="row">
      <input id="fImageFile" type="file" accept="image/*">
      <span id="uploadStatus"></span>
    </div>
    <input type="hidden" id="fImageUrl">
    <img id="preview" class="thumb" style="display:none;margin-bottom:8px;">
    <div class="row">
      <button type="submit" id="saveBtn">Guardar producto</button>
      <button type="button" class="secondary" id="cancelBtn">Cancelar edición</button>
    </div>
  </form>

  <h2>Catálogo (<span id="count">0</span> productos)</h2>
  <input id="search" placeholder="Buscar por nombre..." style="width:100%;margin-bottom:8px;">
  <table id="tbl"><thead>
    <tr><th></th><th>Nombre</th><th>Categoría</th><th>Tamaño</th><th>Precio</th><th></th></tr>
  </thead><tbody></tbody></table>

  <script src="js/products-admin.js"></script>
  <script>
    document.getElementById('loadBtn').addEventListener('click', load);
    document.getElementById('cancelBtn').addEventListener('click', resetForm);
  </script>
</body>
</html>
